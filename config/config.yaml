datasets:
  clientes:
    type: json
    path: data/input/dataset-json-clientes/data/clientes.json.gz
    source:
      url: https://github.com/infobarbosa/dataset-json-clientes
      target: data/input/dataset-json-clientes
  pedidos:
    type: csv
    path: data/input/datasets-csv-pedidos/data/pedidos
    separator: ";"
    source:
      url: https://github.com/infobarbosa/datasets-csv-pedidos
      target: data/input/datasets-csv-pedidos
  top_10_clientes:
    type: csv
    path: data/output/top_10_clientes
    separator: ";"

pipeline:
  top_n: 10
